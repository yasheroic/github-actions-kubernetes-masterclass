---
- name: Setup EC2 with Docker, kubectl, kind and deploy app
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Update all packages to their latest version
      ansible.builtin.apt:
        name: "*"
        state: latest
        cache_valid_time: 3600

    # ===== Docker Installation =====
    - name: Install Docker prerequisite packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Create directory for Docker APT key
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker official GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Get Ubuntu architecture
      ansible.builtin.command: dpkg --print-architecture
      register: ubuntu_arch
      changed_when: false

    - name: Get Ubuntu codename
      ansible.builtin.command: lsb_release -cs
      register: ubuntu_codename
      changed_when: false

    - name: Add Docker official repository
      ansible.builtin.apt_repository:
        repo: >
          deb [arch={{ ubuntu_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ubuntu_codename.stdout }} stable
        state: present
        filename: docker

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Start and enable Docker service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    # ===== kubectl Installation =====
    - name: Install kubectl dependencies
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Download Kubernetes GPG key
      ansible.builtin.shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.32/deb/Release.key | \
        gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.32/deb/ /
        mode: '0644'

    - name: Update apt cache for Kubernetes
      ansible.builtin.apt:
        update_cache: true

    - name: Install kubectl
      ansible.builtin.apt:
        name: kubectl
        state: present

    - name: Hold kubectl version
      ansible.builtin.dpkg_selections:
        name: kubectl
        selection: hold

    # ===== KIND Installation =====
    - name: Download KIND binary
      ansible.builtin.get_url:
        url: https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
        dest: /usr/local/bin/kind
        mode: '0755'

    # ===== Git and Make Setup (non-root) =====
    - name: Install git and make
      ansible.builtin.apt:
        name:
          - git
          - make
        state: present
        update_cache: true

    - name: Reset SSH connection for docker group changes
      ansible.builtin.meta: reset_connection

    # ===== Clone Repository and Run =====
    - name: Clone GitHub repository
      become: false
      ansible.builtin.git:
        repo: "https://github.com/yasheroic/github-actions-kubernetes-masterclass.git"
        dest: "/home/ubuntu/app"
        version: main

    - name: Run make up in background
      become: false
      ansible.builtin.shell: nohup make up > /tmp/make-up.log 2>&1 &
      args:
        chdir: /home/ubuntu/app

    # ===== Verification =====
    - name: Verify Docker installation
      become: false
      ansible.builtin.command: docker --version
      register: docker_version

    - name: Verify kubectl installation
      become: false
      ansible.builtin.command: kubectl version --client
      register: kubectl_version

    - name: Verify KIND installation
      become: false
      ansible.builtin.command: kind --version
      register: kind_version

    - name: Print installation summary
      become: false
      ansible.builtin.debug:
        msg: |
          Installation Summary:
          - Docker: {{ docker_version.stdout }}
          - kubectl: {{ kubectl_version.stdout }}
          - KIND: {{ kind_version.stdout }}
          - Repository cloned to: /home/ubuntu/app
          - make up executed